[project]
name = "visionmocap-ai"
version = "0.1.0"
description = "AI-powered development automation for VisionMoCap"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "gitpython>=3.1.0",
    "pathspec>=0.12.0",
]

[project.scripts]
visionmocap-ai = "visionmocap_ai.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
